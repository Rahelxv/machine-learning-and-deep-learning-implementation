<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rahel</title>
<link rel="icon" type="image/png" href="image/shark.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,700">
<style>
:root{--blue:#1e90ff;--blue-d:#0b6fd6;--soft:#eef6ff;--text:#14243a;--muted:#5a6b80;--line:#d9e9fb}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f6faff;color:var(--text);font-family:"Raleway",sans-serif}
.hero{background:linear-gradient(135deg,#1e90ff 0%,#0b6fd6 100%);color:#fff;padding:56px 20px 84px;text-align:center}
.hero small{display:inline-block;background:rgba(255,255,255,.18);padding:5px 14px;border-radius:999px;font-weight:700;letter-spacing:.08em;font-size:.75rem;text-transform:uppercase}
.hero h1{margin:14px 0 8px;font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:-.01em}
.hero p{margin:0;opacity:.92;font-size:1.05rem}
main{max-width:900px;margin:-48px auto 0;padding:0 16px 48px}
.item{display:flex;gap:20px;padding:18px;margin-bottom:16px;background:#fff;border:1px solid var(--line);border-radius:16px;text-decoration:none;color:inherit;box-shadow:0 2px 10px rgba(30,144,255,.07);transition:transform .2s,box-shadow .2s,border-color .2s}
.item:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 10px 26px rgba(30,144,255,.18)}
.thumb{width:190px;height:130px;flex-shrink:0;border-radius:12px;overflow:hidden;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.item:hover .thumb img{transform:scale(1.05)}
.body{display:flex;flex-direction:column;min-width:0}
.meta{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);background:var(--soft);padding:3px 10px;border-radius:999px;align-self:flex-start;margin-bottom:8px}
.item h2{margin:0 0 6px;font-size:1.1rem;line-height:1.35;color:var(--text)}
.item p{margin:0;font-size:.88rem;line-height:1.6;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:auto;padding-top:10px;font-size:.85rem;font-weight:700;color:var(--blue)}
.item:hover .more{color:var(--blue-d)}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:0 16px 32px}
@media(max-width:620px){.item{flex-direction:column;padding:14px}.thumb{width:100%;height:170px}.hero{padding:44px 16px 76px}}
</style>
</head>
<body>
<header class="hero"><small>Portfolio</small><h1>Data Projects</h1><p>Rahel · <span id="count"></span> projects in regression, clustering, NLP &amp; time series</p></header>
<main id="list"></main>
<footer>© Rahel</footer>
<script>
const articles = [
  {img:'image/Thumb.png',title:'GrayScale Image Processing',desc:'GrayScale Image Processing is a web-based tool that converts color images to grayscale. It offers a simple, fast, and user-friendly interface for effortless image transformation.',url:'https://github.com/Rahelxv/-Grayscale-Image-Processing',date:'2023-01-15'},
  {img:'image/1255.png',title:'Simple Linear Regression (Job Success Rate and Earnings in USD)',desc:'This project analyzes the relationship between freelancers job success rate and their earnings using simple linear regression. The findings show no significant correlation between the two variables. It includes data cleaning, visualization, and model interpretation.',url:'https://rahelxv.github.io/Simple_Linear_Regression_Job_Success_Rate_And_Earning/',date:'2023-01-20'},
  {img:'image/1258.jpg',title:'Multiple Linear Regression (Life Expectancy)',desc:'A data analysis project using multiple linear regression to predict life expectancy based on socioeconomic and health indicators. Includes data cleaning, feature selection, statistical modeling, and interpretation of key results to identify the most influential factors.',url:'https://rahelxv.github.io/Multiple_Linear_Regression_Life_Expectancy/',date:'2023-02-10'},
  {img:'image/78654564.jpg',title:'Multiple Linear Regression with scikit-learn (Smartphones Price Prediction)',desc:'This project uses multiple linear regression with Scikit-learn to estimate smartphone prices based on various features such as RAM, storage, processor, and camera specs. The model demonstration uses dummy data for low-end, mid-range, and high-end smartphones. You can try predicting prices yourself using the tool provided in this portfolio.',url:'https://rahelxv.github.io/Multiple_Linear_Regression_Smartphone_Price_Prediction/',date:'2023-03-01'},
  {img:'image/6363.jpg',title:'Multiple Linear Regression Real Estate Price Prediction',desc:'This project uses a multiple linear regression model to predict house prices per unit area based on property features such as house age, distance to the nearest MRT station, number of nearby convenience stores, and geographic coordinates. The dataset was cleaned, outliers removed, and transformations applied to improve model performance. Multicollinearity was addressed using VIF analysis, and the final model achieved a reasonable R² score, with residual analysis confirming well-distributed errors. This project highlights my skills in data preprocessing, regression modeling, and result interpretation for real-world property data.',url:'https://rahelxv.github.io/Multiple_Linear_Regression_Real_Estate/',date:'2023-04-15'},
  {img:'image/303.jpg',title:'Logistics Regression Student Depression Assessment',desc:'This project applies logistic regression to predict the likelihood of student depression based on factors like academic pressure, study satisfaction, sleep habits, and family history. The model was trained using a real-world dataset and includes steps such as data cleaning, feature encoding, multicollinearity checks, and model evaluation. You can explore the model predictions and insights provided in this portfolio.',url:'https://rahelxv.github.io/Logistics_Regression_Student_Depression/',date:'2025-04-20'},
  {img:'image/456.jpg',title:'KMeans Clustering Billionaires',desc:'This project applies KMeans clustering to group billionaires based on their age and 2024 net worth. The dataset was cleaned and standardized to ensure meaningful clustering. The optimal number of clusters was determined using the Elbow Method. The resulting clusters revealed distinct groups, such as ultra-wealthy elites, emerging younger billionaires, and older individuals with moderate wealth. This project do unsupervised learning, data preprocessing, clustering evaluation, and visual insight generation for socioeconomic data.',url:'https://rahelxv.github.io/Billionaires_KMeans_Clustering/',date:'2025-04-21'},
  {img:'image/1013.jpg',title:'Movies Dendrogram',desc:'This project applies hierarchical clustering to a dataset of top-rated movies to visually explore patterns in their attributes using a dendrogram. By calculating distances between films based on their numerical features (e.g., ratings, votes, year), we uncover natural groupings of similar movies. The dendrogram provides an intuitive tree-like visualization, and a cutoff line is used to identify the optimal number of clusters. This analysis highlights how movie titles with similar audience responses or release periods tend to group together, offering a unique perspective on cinematic trends and viewer preferences.',url:'https://rahelxv.github.io/Dendrogram_Movie/',date:'2025-04-22'},
  {img:'image/1212.jpg',title:'Healthiest Foods Heatmaps and Dendrogram',desc:'This project visualizes the nutritional profile of various foods using heatmaps and hierarchical clustering (dendrograms). The heatmap highlights patterns in nutrient density, while the dendrogram groups foods with similar health properties, helping identify top antioxidant-rich and nutrient-dense items. This project do data preprocessing, visualization, and clustering for deriving meaningful health-related insights.',url:'https://rahelxv.github.io/Heatmaps_Healthiest_Foods/',date:'2025-04-23'},
  {img:'image/2277.jpg',title:'Sentiment Analysis of Bitcoin-Related Tweets',desc:'This project performs sentiment analysis on Bitcoin-related tweets by applying text preprocessing, automatic labeling using the VADER sentiment analyzer, and class balancing through oversampling. It transforms the cleaned data into numerical features using TF-IDF vectorization with n-grams, and trains a Multinomial Naive Bayes model to classify sentiments as positive or negative. This project demonstrates the full pipeline of text data cleaning, feature extraction, model training, evaluation, and prepares the model for future deployment as a web-based sentiment prediction tool.',url:'https://rahelxv.github.io/Sentiment_Analysis_Bitcoin_Related_Tweets/',date:'2025-04-24'},
  {img:'image/1010.jpg',title:'Sentiment Analyzer (Bitcoin Tweet)',desc:'This project analyzes Bitcoin-related tweets by applying text preprocessing and sentiment labeling using a manually cleaned dataset. It transforms the cleaned tweets into numerical features through CountVectorizer and trains a Multinomial Naive Bayes model to classify sentiments as positive or negative. The project demonstrates a complete pipeline from data cleaning, feature engineering, model training, and deployment preparation, culminating in a web-based application that predicts tweet sentiments in real time.',url:'https://github.com/Rahelxv/Bitcoin_Tweet_Sentiment_Analyzer',date:'2025-04-25'},
  {img:'image/666.jpg',title:'Daily USDJPY Triple Exponential Smoothing (Holt winters)',desc:'This project forecasts the USD/JPY exchange rate using Triple Exponential Smoothing (Holt-Winters method) on daily historical data. It involves comprehensive data preprocessing, including handling missing values, setting a consistent time frequency, and renaming variables for clarity. The project explores seasonality and trend through visualizations and statistical decomposition to confirm the presence of strong annual cycles. The Holt-Winters model, configured with additive trend and seasonality and a yearly period of 365 days, is trained on 80% of the data and tested on the remaining 20%. The workflow covers the full forecasting pipeline—data preparation, model fitting, performance evaluation using MAE, RMSE, and MAPE metrics, and visual assessment—offering insights into both the models capability and its limitations in capturing long-term forex patterns.',url:'https://rahelxv.github.io/Daily_USDJPY_Triple_Exponential_Smoothing/',date:'2025-04-28'},
  {img:'image/777.jpg',title:'Sarima Barley Price Prediction',desc:'This project forecasts the price of barley in Alberta using the Seasonal ARIMA (SARIMA) model on annual historical data. It involves systematic data preprocessing, including filtering specific crop types and geographic regions, handling missing values, and renaming variables for clarity. The project examines underlying trends and seasonality through exploratory data analysis and decomposition plots to confirm cyclical patterns. The SARIMA model configured with optimized seasonal and non-seasonal parameters to capture yearly patterns. The workflow encompasses the complete forecasting pipeline—data preparation, model fitting, parameter tuning, evaluation using MAE, RMSE, and MAPE, and visual interpretation—highlighting both the strengths and limitations of the model in predicting agricultural price fluctuations.',url:'https://rahelxv.github.io/Barley_Price_Prediction/',date:'2025-04-29'},
  {img:'image/805.jpg',title:'Dogeusdt Price Prediction AutoRegressive ',desc:'This project forecasts the closing price of Dogecoin (DOGE) using an Autoregressive (AR) model on daily historical cryptocurrency data. It involves methodical data preprocessing, including time-based filtering, handling missing values, and ensuring proper datetime indexing. The project conducts exploratory data analysis to identify key statistical properties, followed by stationarity testing and differencing to transform the series for AR modeling. The optimal lag parameter is selected based on PACF analysis and validated with AIC/BIC scores. The forecasting workflow covers data preparation, model training, residual diagnostics, and evaluation. Residual plots, histograms, ACF/PACF diagnostics, and Q-Q plots are used to assess the model’s performance and adherence to assumptions, highlighting its predictive power and limitations in capturing volatility-driven price behavior in cryptocurrency markets.',url:'https://rahelxv.github.io/Dogecoin_Price_Prediction_AutoRegressive/',date:'2025-04-30'},
  {img:'image/656.jpg',title:'Pepe Coin Moving Average Model Prediction',desc:'This project forecasts the closing price of PEPE Coin using a Moving Average (MA) model applied to the returns of daily historical cryptocurrency data. The workflow begins with comprehensive data preprocessing, including datetime indexing, handling of missing values, and calculation of daily returns to transform the series for stationarity. Exploratory data analysis is conducted to inspect the data distribution, temporal behavior, and seasonality using Q-Q plots and monthly seasonal plots. Stationarity is validated through visual inspection and statistical testing. The MA model is fitted on the return series, with lag selection informed by autocorrelation analysis and iterative evaluation. The forecasted returns are then reconstructed into price levels for interpretability. The project demonstrates the MA model’s strengths in trend estimation while noting its limitations in capturing abrupt price movements typical in volatile crypto markets like PEPE.',url:'https://rahelxv.github.io/Moving_Average_Prediction_Pepe_Coin/',date:'2025-05-01'},
  {img:'image/987.jpg',title:'Tron Coin ARMA Model Prediction',desc:'This project forecasts the closing price of TRIN Coin using an Autoregressive Moving Average (ARMA) model applied to the log returns of daily historical cryptocurrency data. The analytical workflow begins with structured data preprocessing, including datetime parsing, missing value handling, and transformation of raw prices into log return series to achieve stationarity. Exploratory data analysis includes distribution checks, volatility inspection, and autocorrelation diagnostics to guide model formulation. Stationarity is validated through ADF tests and differencing techniques. The optimal ARMA parameters are selected based on AIC and BIC scores, supported by iterative likelihood ratio (LLR) testing. Once fitted, the ARMA model forecasts future returns, which are subsequently reintegrated to obtain price level predictions. The project highlights ARMA capacity to model both trend persistence and random shocks, while acknowledging its sensitivity to parameter tuning and limitations in highly erratic market regimes such as that of TRON Coin.',url:'https://rahelxv.github.io/Tron_Coin_ARMA_Prediction/',date:'2025-05-02'},
  {img:'image/357.jpg',title:'Gold Price Prediction Using Arima Model',desc:'This project forecasts the closing price of Gold using an Autoregressive Integrated Moving Average (ARIMA) model applied to daily historical price data. The modeling pipeline begins with comprehensive data preprocessing, including timestamp normalization, missing value imputation, and differencing to ensure stationarity. Stationarity is rigorously evaluated using the Augmented Dickey-Fuller (ADF) test. The optimal ARIMA configuration is determined using Auto_ARIMA(), guided by minimization of the Akaike Information Criterion (AIC) and Bayesian Information Criterion (BIC), with model adequacy assessed through residual diagnostics. While Auto_ARIMA provides an efficient parameter selection process, the resulting model remains too simplistic to fully capture the underlying complexity and nonlinear dynamics of gold price movements.',url:'https://rahelxv.github.io/Gold_Price_Prediction_Arima_Model/',date:'2025-05-03'},
  {img:'image/6521.jpg',title:'Temperature Prediction Using Arimax Model',desc:'This project forecasts hourly temperature values using an Autoregressive Integrated Moving Average with Exogenous Variables (ARIMAX) model applied to historical weather data. The modeling pipeline includes robust preprocessing steps such as timestamp parsing, missing value imputation, and first-order differencing to achieve stationarity. Stationarity is validated using the Augmented Dickey-Fuller (ADF) test. The model incorporates multiple exogenous predictors including humidity, wind speed, and atmospheric pressure to enhance forecasting accuracy. Optimal ARIMAX parameters are selected via Auto_ARIMA(), using AIC and BIC minimization as evaluation criteria. Model performance is assessed through residual diagnostics and forecast accuracy metrics such as MAE, RMSE, and MAPE. The resulting model demonstrates strong capability in capturing short-term temperature fluctuations in an hourly setting, offering practical value for localized weather forecasting applications.',url:'https://rahelxv.github.io/Temperature_Prediction_Arimax_Model/',date:'2025-05-04'},
  {img:'image/2121212.jpg',title:'Website Load Page Using Sarimax Model',desc:"This project forecasts daily website page load traffic using a Seasonal Autoregressive Integrated Moving Average with Exogenous Variables (SARIMAX) model. The modeling workflow includes rigorous data preprocessing steps such as datetime conversion, frequency resampling, and check for first-order or second-order differencing to achieve stationarity, which is confirmed using the Augmented Dickey-Fuller (ADF) test. Seasonal patterns are identified and incorporated into the model with a defined seasonal period. Exogenous predictors—such as day of the week, number of unique visitors, and first-time vs. returning visits—are integrated to improve forecasting precision. Model parameters are optimized using Auto_ARIMA() with AIC and BIC minimization. Evaluation includes both visual inspection of forecast alignment and statistical diagnostics such as residual ACF plots and the Ljung-Box test. Despite good short-term visual forecasts, residual autocorrelation suggests the potential for improvement, possibly through refined feature engineering or advanced machine learning models. The model offers actionable insights for traffic forecasting in web analytics and server capacity planning.",url:'https://rahelxv.github.io/Website_Prediction_Sarimax_Model/',date:'2025-05-05'},
  {img:'image/699.jpg',title:'Volatility Prediction Using ARCH & GARCH Model',desc:"This project focuses on modeling and forecasting Temperature volatility using Autoregressive Conditional Heteroskedasticity (ARCH) and Generalized ARCH (GARCH) models, with optimal parameter selection based on empirical performance. After transforming raw price data into returns, the workflow involves rigorous preprocessing, including stationarity validation via the Augmented Dickey-Fuller (ADF) test and confirmation of volatility clustering through autocorrelation plots of squared returns. A custom parameter tuning function is used to identify the best-fitting GARCH configuration, leading to the selection of a GARCH(1,3) model based on information criteria and residual diagnostics. The model is iteratively refit in a rolling window to produce dynamic one-step-ahead volatility forecasts. Evaluation includes visual comparison of predicted versus actual volatility, analysis of standardized residuals, and the Ljung-Box test to assess model adequacy. The project demonstrates how volatility models can capture conditional heteroskedasticity and provide actionable insights for financial risk analysis and market behavior interpretation.",url:'https://rahelxv.github.io/Volatility_Prediction_Using_ARCH_And_GARCH_Model/',date:'2025-05-06'},
  {img:'image/569.jpg',title:'Visualization of ARIMA Family',desc:"This project explores modeling and forecasting Bitcoin returns using ARIMA and SARIMA family models, with a focus on visualizing model behavior and prediction accuracy. The pipeline begins with transforming raw price data into return series. Multiple ARIMA and SARIMA configurations are tested. visual comparisons are made between predicted and actual returns. Emphasis is placed on how model complexity and information criteria affect predictive performance. The project highlights the strengths and limitations of ARIMA-based models when applied to financial time series and offers visual insight into their temporal prediction patterns.",url:'https://rahelxv.github.io/Visualization_of_Arima_Family_Prediction_on_Bitcoin_Returns_Prices/',date:'2025-05-07'},
  {img:'image/822.jpg',title:'Website View Prediction with Prophet Model',desc:"This project focuses on forecasting daily website page views using Facebook's Prophet model. The workflow begins with time series preprocessing and feature engineering, including regressors such as ad spend and holiday indicators. An 80/20 time-based train-test split is applied to preserve temporal order. Hyperparameters are tuned using cross-validation to improve forecast accuracy. The model's predictions are evaluated against actual values using MAPE and RMSE. Seasonal decomposition and component plots offer clear insights into trend, weekly, and yearly patterns. The project demonstrates the effectiveness of Prophet in capturing complex seasonality and external influences in web traffic forecasting.",url:'https://rahelxv.github.io/Website_View_Prediction_with_Prophet_Model/',date:'2025-05-08'},
  {img:'image/735.jpg',title:'Rainfall Samarinda Prophet Model',desc:"This project focuses on forecasting monthly rainfall in Samarinda using Facebook's Prophet model. The workflow begins with time series preprocessing, missing value imputation, and exploratory analysis to uncover seasonal patterns and anomalies. An 80/20 time-based train-test split is applied to maintain chronological integrity. The model is tuned using cross-validation to optimize parameters such as changepoint and seasonality priors. Forecast accuracy is evaluated using MAPE and RMSE metrics. A residual analysis is performed to identify and visualize extreme rainfall outliers, which are then analyzed by year to detect temporal trends. The project reveals both clear seasonality and an increasing intensity of outlier rainfall events, suggesting shifts in climate behavior and highlighting the limitations of purely seasonal models when facing extreme weather variability.",url:'https://rahelxv.github.io/Rainfall_Samarinda_Prophet_Model/',date:'2025-05-09'},
  {img:'image/5656.jpg',title:'EURJPY 5 Minute LSTM Model Forecast',desc:"This project focuses on forecasting 5-minute EURJPY price movements using an LSTM neural network. The workflow includes constructing a multivariate time series with covariates such as spread, tick volume, and temporal features like weekday and hour. Data is scaled and windowed to meet LSTM input requirements. The model is tuned through cross-validation across hyperparameters like hidden dimensions, layer count, learning rate, and input chunk length. Forecast performance is evaluated using RMSE, MAE, and MAPE metrics. Residual diagnostics and plots comparing predictions to actual prices help identify lagged response patterns and potential overfitting.",url:'https://rahelxv.github.io/EURJPY_5_Minute_LSTM_Model/',date:'2025-05-10'},
  {img:'image/10721.jpg',title:'Multiple Time Series Forecasting Online Retail Dataset with LSTM Model',desc:'This project focuses on forecasting sales quantity over time using an LSTM neural network on the Online Retail dataset. Each product (identified by StockCode) is treated as an individual time series, enabling multiple time series forecasting within a unified LSTM framework. The workflow involves cleaning transactional data, resampling to consistent time intervals, and engineering covariates such as weekday and month. The data is scaled and windowed to fit the LSTM’s sequential input structure. The model is trained across grouped time series, with hyperparameters like hidden units, number of layers, dropout, and input chunk length optimized via grid search. Evaluation metrics including RMSE are computed per series to assess forecasting accuracy.',url:'https://rahelxv.github.io/Multiple_Time_Series_Forecasting_LSTM_Model/',date:'2025-05-11'},
  {img:'image/151515.jpg',title:'USDJPY 5 Minute Forecasting with Temporal Fusion Transformer (TFT)',desc:"This project focuses on forecasting short-term price movements of the USDJPY currency pair using the Temporal Fusion Transformer (TFT) model. The dataset consists of 5-minute interval data, incorporating technical indicators such as moving average, spread and tick volume as past covariates, and temporal features like hour and weekday as future covariates. The data undergoes preprocessing steps including resampling, gap handling, scaling, and time feature engineering. The TFT model is trained on a single series with rich covariate context, enabling it to learn complex temporal dependencies and attention-based feature relevance. Hyperparameters including hidden size, attention heads, input/output chunk lengths, and dropout rates are tuned via cross-validation. The model’s performance is evaluated using RMSE, MAE, and residual plots to assess both accuracy and stability in capturing intraday forex patterns.",url:'https://rahelxv.github.io/USDJPY_5_Minute_Forecasting_with_Temporal_Fusion_Transformer/',date:'2025-05-12'},
  {img:'image/1919.jpg',title:'Official Trump USD Coin Prediction With N-BEATS Model',desc:"This project focuses on forecasting the daily price of the Official Trump USD Coin using the N-BEATS (Neural Basis Expansion Analysis for Time Series) model. The dataset spans from January to June 2025 and includes market capitalization and total volume as past covariates. Temporal features such as day, week, and month are encoded using both cyclic and positional time encoders. The data undergoes preprocessing steps including resampling, timezone handling, scaling, and encoder transformation. The N-BEATS model is trained on the transformed series with structured covariates to capture both short- and long-term trends. Model parameters such as input/output chunk length, number of stacks, and layer widths are tuned via grid search. Performance is assessed using cross-validation folds with RMSE as the main evaluation metric, and the final forecast is visualized alongside actual price trajectories to evaluate the model’s ability to capture political-meme coin dynamics.",url:'https://rahelxv.github.io/Official_Trump_USD_Coin_Prediction_With_N-BEATS_Model/',date:'2025-05-13'}
];
const fmt=d=>new Date(d).toLocaleDateString('en-US',{month:'short',year:'numeric'});
const sorted=articles.sort((a,b)=>new Date(b.date)-new Date(a.date));
document.getElementById('count').textContent=sorted.length;
document.getElementById('list').innerHTML=sorted.map(a=>`<a class="item" href="${a.url}"><div class="thumb"><img src="${a.img}" alt="${a.title}" loading="lazy"></div><div class="body"><span class="meta">${fmt(a.date)}</span><h2>${a.title}</h2><p>${a.desc}</p><span class="more">View project →</span></div></a>`).join('');
</script>
</body>
</html>
